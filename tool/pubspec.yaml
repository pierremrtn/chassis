name: chassis_repo_tool
description: Repository CI tooling — docs/skills validation (not published).
publish_to: none

environment:
  sdk: ^3.6.2

# NOT a member of the chassis pub workspace, on purpose: the tool only needs
# package:analyzer for parsing doc snippets and must not constrain (or be
# constrained by) the analyzer pin of chassis_builder. It resolves standalone,
# like chassis_lint. Run `dart pub get` in tool/ before `dart run
# tool/check_docs.dart`.

dependencies:
  analyzer: ">=8.0.0 <15.0.0"

dev_dependencies:
  lints: ^5.0.0
