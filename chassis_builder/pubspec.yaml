name: chassis_builder
description: Code generation for the chassis architectural framework — generates module mediator interfaces and the app's concrete mediator from @chassisHandler classes.
version: 1.0.0
repository: https://github.com/pierremrtn/chassis
homepage: https://affordant.gitbook.io/chassis/
topics:
  - chassis
  - codegen
  - build-runner
  - architecture

environment:
  sdk: ^3.6.2

resolution: workspace

dependencies:
  analyzer: ">=12.0.0 <15.0.0"
  build: ^4.0.0
  source_gen: ^4.0.0
  code_builder: ^4.10.0
  chassis: ^1.0.0

dev_dependencies:
  build_test: ^3.4.0
  build_runner: ^2.15.0
  lints: ^5.0.0
  test: ^1.25.6
