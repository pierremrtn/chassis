name: chassis_builder
description: Code generation for the chassis architectural framework — generates the app's concrete mediator, registering every @chassisHandler class in its constructor.
version: 1.0.0
repository: https://github.com/pierremrtn/chassis
homepage: https://affordant.gitbook.io/chassis/
topics:
  - chassis
  - codegen
  - build-runner
  - architecture

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  # 13.3.0 is the verified floor for parsing Dart 3.13 primary constructors
  # (12.x gates the feature behind an experiment flag and fails to resolve
  # any source using them, including package:chassis itself).
  analyzer: ">=13.3.0 <15.0.0"
  build: ^4.0.0
  source_gen: ^4.0.0
  code_builder: ^4.10.0
  chassis: ^1.0.0

dev_dependencies:
  build_test: ^3.4.0
  build_runner: ^2.15.0
  lints: ^5.0.0
  test: ^1.25.6
